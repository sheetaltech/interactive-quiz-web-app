<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Interactive Quiz</h1>

        <p id="question-number">Question 1 of 5</p>

        <h2 id="question">Which language is used to style a webpage?</h2>

        <div id="options">
            <button class="option">HTML</button>
            <button class="option">CSS</button>
            <button class="option">JavaScript</button>
            <button class="option">Python</button>
        </div>

        <button id="next-button">Next</button>

        <p id="score">Score: 0</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
